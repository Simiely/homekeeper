<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾光集</title>
    <meta name="theme-color" content="#0f1116" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      // 提前应用主题，避免页面闪烁
      (function () {
        const t = localStorage.getItem("hk_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">拾光集</div>
      <nav>
        <button data-view="dashboard" class="active">概览</button>
        <button data-view="items">物品</button>
        <button data-view="locations">位置</button>
        <button data-view="categories">分类</button>
        <button data-view="tags">标签</button>
        <span class="nav-sep" aria-hidden="true"></span>
        <div class="nav-dropdown admin-only" style="display:none">
          <button id="settings-toggle" class="nav-parent" type="button">设置 <span class="nav-caret" aria-hidden="true">▾</span></button>
          <div id="settings-menu" class="nav-menu hidden">
            <button data-view="admin" data-parent="settings" type="button">用户管理</button>
            <button data-view="backups" data-parent="settings" type="button">数据备份</button>
          </div>
        </div>
      </nav>
      <button id="theme-toggle" class="ghost theme-btn" title="切换主题" type="button">🌙</button>
      <button id="notif-btn" class="ghost" title="推送通知状态" style="font-size:18px">🔕</button>
      <button id="logout" class="ghost">登出</button>
    </header>

    <main>
      <section id="view-dashboard" class="view"></section>
      <section id="view-items" class="view hidden"></section>
      <section id="view-locations" class="view hidden"></section>
      <section id="view-categories" class="view hidden"></section>
      <section id="view-tags" class="view hidden"></section>
      <section id="view-backups" class="view hidden"></section>
      <section id="view-admin" class="view hidden"></section>
    </main>

    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
